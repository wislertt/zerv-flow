[package]
name = "zerv-flow-demo"
version = "0.0.0" # Use git tag
edition = "2024"

[lib]
name = "zerv_flow_demo"
path = "src/lib.rs"

[[bin]]
name = "zerv-flow-demo"
path = "src/main.rs"

[dependencies]
axum = ">=0.8"
serde_json = ">=1.0.145"
tokio = { features = ["full"], version = ">=1.48.0" }
tower-http = { features = ["trace"], version = ">=0.6.7" }
tracing = ">=0.1.43"
tracing-subscriber = { features = ["env-filter"], version = ">=0.3.22" }

[dev-dependencies]
axum-test = ">=18.4.1"
futures = ">=0.3.31"
reqwest = ">=0.12.24"
reserve-port = ">=2.3.0"
tokio-test = ">=0.4.4"
